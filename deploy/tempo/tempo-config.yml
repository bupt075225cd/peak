# Tempo 单机配置：接收 OTLP（gRPC 4317 / HTTP 4318），
# 本地文件系统存储 trace，按 TraceID 检索（与本项目查询模式匹配）。
# 业务服务的 TRACING_ENDPOINT 指向 tempo:4317（gRPC）。
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h  # trace 保留 7 天

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

multitenancy_enabled: false

usage_report:
  reporting_enabled: false
