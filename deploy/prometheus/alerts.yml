# Prometheus 告警规则（面向运维值班与线上问题定位）。
# 阈值为初始经验值，可按实际流量在 Grafana 上观察后调整。
groups:
  - name: availability
    rules:
      # 服务宕机：抓取目标不可达 1 分钟。
      - alert: ServiceDown
        expr: up{job=~"gateway|question-service|recognition-service|user-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务 {{ $labels.job }} 不可达"
          description: "{{ $labels.job }} 的 /metrics 抓取失败超过 1 分钟，实例 {{ $labels.instance }} 可能已崩溃或被 OOM。"

  - name: http
    rules:
      # 5xx 错误率：5 分钟窗口内 5xx 占比超 5%。
      - alert: HTTP5xxRateHigh
        expr: |
          sum by (job) (rate(http_requests_total{status="5xx"}[5m]))
            / sum by (job) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} 5xx 错误率超 5%"
          description: "{{ $labels.job }} 近 5 分钟 5xx 占比 {{ $value | humanizePercentage }}。可到 Grafana → Tempo 按时间点查慢/失败请求链路。"

      # P99 延迟：5 分钟窗口内 P99 超 2s。
      - alert: HTTPP99LatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum by (le, job) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} P99 延迟超 2s"
          description: "{{ $labels.job }} 近 5 分钟 P99 为 {{ $value }}s。用响应头 X-Trace-Id / 前端事件 trace_id 到 Tempo 查链路，定位卡在 SQL 还是第三方 AI。"

  - name: business
    rules:
      # 识别任务失败率：30 分钟窗口内失败占比超 30%（AI 抖动或渠道故障的信号）。
      - alert: RecognitionTaskFailureRateHigh
        expr: |
          sum by (provider) (rate(recognition_task_total{status="failed"}[30m]))
            / sum by (provider) (rate(recognition_task_total[30m])) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "识别服务 {{ $labels.provider }} 任务失败率超 30%"
          description: "近 30 分钟 provider={{ $labels.provider }} 失败率 {{ $value | humanizePercentage }}。检查 AI 调用指标 ai_call_total 与对应 span。"

      # AI 调用错误率：第三方 AI 接口单能力错误率超 50%。
      - alert: AICallErrorRateHigh
        expr: |
          sum by (provider, operation) (rate(ai_call_total{status="error"}[10m]))
            / sum by (provider, operation) (rate(ai_call_total[10m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI 调用 {{ $labels.provider }}/{{ $labels.operation }} 错误率超 50%"
          description: "第三方 AI 接口 {{ $labels.operation }} 持续失败，可能为额度耗尽/限流/模型故障。"

  - name: database
    rules:
      # 连接池等待：每秒新增等待超 0.5 次，说明池接近饱和。
      - alert: DBPoolWaitHigh
        expr: rate(db_wait_count_total{job=~".*service"}[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} 数据库连接池出现等待"
          description: "连接池等待计数持续增长，请求在排队等连接。检查慢查询（gorm 慢查询日志 / db.statement span）与 max_open_conns 配置。"

  - name: frontend
    rules:
      # 前端错误突增：JS 错误 / 资源加载失败事件速率超 0.5 条/秒。
      - alert: FrontendErrorSpike
        expr: sum(rate(frontend_report_total{type="error"}[15m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "前端错误上报突增"
          description: "前端 js_error/unhandled_rejection/resource_error 速率 {{ $value }}/s。到 Loki 按 event_type=error 检索详细堆栈。"
