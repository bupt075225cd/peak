# Loki 单机配置：本地文件系统存储，只索引标签（低成本集中日志查询）。
# 日志由 Alloy 从容器 stdout 采集推送（JSON 格式，含 trace_id 字段）。
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 保留 7 天后自动删除旧数据（轻量单机部署，控制磁盘占用）。
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
