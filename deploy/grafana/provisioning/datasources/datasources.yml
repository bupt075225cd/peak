# Grafana 数据源自动注册（provisioning，免手工配置）。
# 轻量方案：指标（Prometheus）+ 日志（Loki）两个数据源；
# 链路追踪（Tempo）已移除，日志中 trace_id 字段仍保留，可按字段值检索串联单请求日志。
apiVersion: 1

datasources:
  # ── 指标 ────────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prom
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  # ── 日志 ────────────────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
