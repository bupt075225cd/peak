# 生产部署编排：后端微服务 + MySQL + Prometheus
# 用法：
#   docker compose -f docker-compose.prod.yml pull     # 拉取镜像仓库已构建镜像
#   docker compose -f docker-compose.prod.yml up -d
#   镜像 tag 通过 .env 的 IMAGE_TAG 指定（commit sha 或 latest，默认 latest）
# 说明：
#   - 业务镜像来自阿里云 ACR（CI 推送），私有仓库需先 docker login
#   - 配置通过环境变量注入（config.yaml 使用 ${VAR} 占位）
#   - 敏感信息（DB 密码、阿里云密钥）通过 .env 文件或环境注入，勿提交到仓库
services:
  # ── 基础设施 ────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: peak-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-peak123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-peak}
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-peak123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 不对外暴露 3306，仅内网访问
    expose:
      - "3306"

  # ── 后端服务 ────────────────────────────────────────────
  # 对象存储使用外部第三方 S3 兼容服务（阿里云 OSS / AWS S3 / Ceph 等），
  # 不在本编排内自建。双桶隔离：recognition-service 用 S3_RECOGNITION_BUCKET
  # （transient/ 临时区），question-service 用 S3_QUESTION_BUCKET（committed/
  # 正式区），提交拷贝通过对象存储服务端 CopyObject 跨桶完成；
  # 连接参数通过 S3_* 环境变量注入。
  # 镜像由 CI 推送到阿里云 ACR；如需本地构建，把 image 换回对应 build: 配置
  gateway:
    image: crpi-vb458bo8ja2welze.cn-chengdu.personal.cr.aliyuncs.com/peak2026/peak-gateway:${IMAGE_TAG:-latest}
    container_name: peak-gateway
    restart: unless-stopped
    depends_on:
      question-service:
        condition: service_started
      recognition-service:
        condition: service_started
      user-service:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      LOG_DEV: "false"
      QUESTION_SERVICE_URL: "http://question-service:8081"
      RECOGNITION_SERVICE_URL: "http://recognition-service:8082"
      USER_SERVICE_URL: "http://user-service:8083"
      # JWT 密钥须与 user-service 一致
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TRACING_ENDPOINT: ${TRACING_ENDPOINT:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  question-service:
    image: crpi-vb458bo8ja2welze.cn-chengdu.personal.cr.aliyuncs.com/peak2026/peak-question-service:${IMAGE_TAG:-latest}
    container_name: peak-question-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: "8081"
      LOG_DEV: "false"
      DB_DIALECT: "mysql"
      DB_DSN: "${MYSQL_USER:-root}:${MYSQL_ROOT_PASSWORD:-peak123456}@tcp(mysql:3306)/${MYSQL_DATABASE:-peak}?charset=utf8mb4&parseTime=True&loc=Local"
      # 专属桶存放 committed/ 正式区；transient/ -> committed/ 提交拷贝
      # 通过对象存储服务端 CopyObject 从 recognition 桶跨桶完成
      STORAGE_TYPE: "s3"
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_QUESTION_BUCKET:?S3_QUESTION_BUCKET is required}
      # 源桶 = recognition-service 的桶（transient/ 临时区），需与目标桶同一 Endpoint
      S3_SOURCE_BUCKET: ${S3_RECOGNITION_BUCKET:?S3_RECOGNITION_BUCKET is required}
      S3_USE_SSL: ${S3_USE_SSL:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
      TRACING_ENDPOINT: ${TRACING_ENDPOINT:-}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  recognition-service:
    image: crpi-vb458bo8ja2welze.cn-chengdu.personal.cr.aliyuncs.com/peak2026/peak-recognition-service:${IMAGE_TAG:-latest}
    container_name: peak-recognition-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: "8082"
      LOG_DEV: "false"
      DB_DIALECT: "mysql"
      DB_DSN: "${MYSQL_USER:-root}:${MYSQL_ROOT_PASSWORD:-peak123456}@tcp(mysql:3306)/${MYSQL_DATABASE:-peak}?charset=utf8mb4&parseTime=True&loc=Local"
      # 部署使用第三方 S3 兼容对象存储（阿里云 OSS / AWS S3 / Ceph 等），
      # 连接参数通过 .env 或部署环境注入，必需：S3_ENDPOINT / S3_RECOGNITION_BUCKET / 凭证。
      # 专属桶存放 transient/ 临时区；question-service 的提交拷贝经服务端
      # CopyObject 从本桶跨桶读取，凭证需允许其跨桶读取。
      STORAGE_TYPE: "s3"
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required, e.g. https://oss-cn-hangzhou.aliyuncs.com}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_RECOGNITION_BUCKET:?S3_RECOGNITION_BUCKET is required}
      S3_USE_SSL: ${S3_USE_SSL:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}  # OSS/AWS 用虚拟主机风格；Ceph/MinIO 等置 true
      # STORAGE_ROOT 保留：STORAGE_TYPE=local 回退时仍可用。
      STORAGE_ROOT: "/data"
      RECOGNITION_PROVIDER: ${RECOGNITION_PROVIDER:-aliyun}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_SECRET: ${ALIYUN_ACCESS_SECRET:-}
      ALIYUN_OCR_ENDPOINT: ${ALIYUN_OCR_ENDPOINT:-}
      ALIYUN_DASH_KEY: ${ALIYUN_DASH_KEY:-}
      ALIYUN_DASH_MODEL: ${ALIYUN_DASH_MODEL:-qwen3.8-flash}
      # 智谱开放平台（RECOGNITION_PROVIDER=zhipu 时使用）。
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_MODEL: ${ZHIPU_MODEL:-glm-5.3-flash}
      ZHIPU_REASONING_EFFORT: ${ZHIPU_REASONING_EFFORT:-low}
      # 几何重绘由服务内置的 Go 渲染器完成（VLM 坐标直出 + 文字避让 + 手写 SVG），
      # 全程无外部依赖。
      GEOMETRY_ENABLED: "true"
      GEOMETRY_MAX_ATTEMPTS: ${GEOMETRY_MAX_ATTEMPTS:-3}
      TRACING_ENDPOINT: ${TRACING_ENDPOINT:-}
    volumes:
      - recognition-data:/data
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  user-service:
    image: crpi-vb458bo8ja2welze.cn-chengdu.personal.cr.aliyuncs.com/peak2026/peak-user-service:${IMAGE_TAG:-latest}
    container_name: peak-user-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: "8083"
      LOG_DEV: "false"
      DB_DIALECT: "mysql"
      DB_DSN: "${MYSQL_USER:-root}:${MYSQL_ROOT_PASSWORD:-peak123456}@tcp(mysql:3306)/${MYSQL_DATABASE:-peak}?charset=utf8mb4&parseTime=True&loc=Local"
      # JWT 密钥须与 gateway 一致；生产必须通过 .env 注入强随机值
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-168h}
      # 超级验证码仅限开发模式，生产编排强制关闭
      AUTH_MASTER_CODE: "false"
      TRACING_ENDPOINT: ${TRACING_ENDPOINT:-}
    expose:
      - "8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── 前端（Nginx 托管静态资源 + 反代 /api）────────────────
  web:
    image: crpi-vb458bo8ja2welze.cn-chengdu.personal.cr.aliyuncs.com/peak2026/peak-web:${IMAGE_TAG:-latest}
    container_name: peak-web
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "80:80"

  # ── 可观测性 ────────────────────────────────────────────
  # Prometheus（指标）+ Alertmanager（告警）+ Loki/Alloy（日志）
  # + Tempo（链路）+ Grafana（统一入口，预置看板与三支柱互跳）。
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: peak-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    depends_on:
      alertmanager:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: peak-alertmanager
    restart: unless-stopped
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    expose:
      - "9093"

  loki:
    image: grafana/loki:3.1.1
    container_name: peak-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    expose:
      - "3100"

  # Alloy：采集全部容器 stdout 日志推送 Loki（需挂载 docker.sock）。
  alloy:
    image: grafana/alloy:v1.1.1
    container_name: peak-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.6.0
    container_name: peak-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    volumes:
      - ./deploy/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    expose:
      - "3200"
      - "4317"  # OTLP gRPC：业务服务 TRACING_ENDPOINT 指向此处
      - "4318"  # OTLP HTTP

  grafana:
    image: grafana/grafana:11.2.0
    container_name: peak-grafana
    restart: unless-stopped
    environment:
      # 强制登录：管理员账号经 .env 注入强密码（必填，无默认弱口令）。
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 关闭匿名访问：所有看板/Explore 查询均需登录。
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 仅绑定主机回环地址：外网/内网其它机器不可直接访问，
      # 运维经 SSH 隧道访问（ssh -L 3001:127.0.0.1:3001 root@<host>）。
      # 主机侧端口可通过 GRAFANA_PORT 覆盖（默认 3001，与主机上其他服务冲突时改此值）。
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  mysql-data:
  recognition-data:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
