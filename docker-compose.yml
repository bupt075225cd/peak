services:
  postgres:
    image: postgres:16-alpine
    container_name: peak-postgres
    environment:
      # 容器内以该用户作为超级用户初始化（首次启动生效），数据库同名创建。
      POSTGRES_USER: peak
      POSTGRES_PASSWORD: peak123456
      POSTGRES_DB: peak
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peak -d peak"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Prometheus（可观测性，可选）：归入 observability profile，
  # 默认 docker compose up -d 不启动；需要时 --profile observability
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    container_name: peak-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  postgres-data:
