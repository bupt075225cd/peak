server:
  port: "${SERVER_PORT:-8080}"

log:
  development: ${LOG_DEV:-true}

tracing:
  endpoint: "${TRACING_ENDPOINT:-}"  # OpenTelemetry collector 地址，留空则不启用追踪

# 鉴权：JWT 密钥必须与 user-service 一致（经环境变量注入）。
auth:
  jwt_secret: "${JWT_SECRET:-peak-dev-secret}"
  # 多应用隔离：路由前缀 -> 允许的 JWT aud（应用受众）。
  # app-peak 为统一前端过渡期客户端；前端按独立域名拆分后，
  # 各自使用 app-mistake / app-poetry 并收紧对应列表。
  audience_routes:
    /api/mistakes: ["app-mistake", "app-peak"]
    /api/questions: ["app-mistake", "app-peak"]
    /api/categories: ["app-mistake", "app-peak"]
    /api/recognition: ["app-mistake", "app-peak"]
    /api/poetry: ["app-poetry", "app-peak"]
    /api/ledger: ["app-ledger", "app-peak"]
  # 是否放行无 aud 的历史令牌；前端全部接入 X-Client-Id 后置为 false 收紧。
  allow_legacy_tokens: "${AUTH_ALLOW_LEGACY_TOKENS:-true}"

# CORS：前端来源白名单（精确匹配 Origin；独立域名各应用分别登记）。
# 留空回退 *（仅限本地开发），上线必须显式配置各应用域名。
cors:
  allowed_origins: "${CORS_ALLOWED_ORIGINS:-}"

# 路由前缀 -> 后端服务地址（可用环境变量覆盖，生产环境指向服务名）
routes:
  /api/questions: "${QUESTION_SERVICE_URL:-http://localhost:8081}"
  /api/recognition: "${RECOGNITION_SERVICE_URL:-http://localhost:8082}"
  /api/users: "${USER_SERVICE_URL:-http://localhost:8083}"
  /api/mistakes: "${QUESTION_SERVICE_URL:-http://localhost:8081}"
  /api/categories: "${QUESTION_SERVICE_URL:-http://localhost:8081}"
  /api/poetry: "${POETRY_SERVICE_URL:-http://localhost:8084}"
  /api/ledger: "${ASSET_SERVICE_URL:-http://localhost:8085}"

# 按用户令牌桶限流：仅对账本等高敏感前缀生效，避免影响既有应用。
ratelimit:
  prefixes: "${RATELIMIT_PREFIXES:-/api/ledger}"
  rps: "${RATELIMIT_RPS:-2}"
  burst: "${RATELIMIT_BURST:-30}"

# 安全响应头：CSP 置空可关闭（按环境放开外部资源时需要）。
security:
  csp: "${SECURITY_CSP:-default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'}"
