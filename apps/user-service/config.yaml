server:
  port: "8083"

log:
  development: ${LOG_DEV:-true}

# 数据库（本地免 MySQL 调测可用 sqlite）。
database:
  dialect: "${DB_DIALECT:-sqlite}"
  dsn: "${DB_DSN:-./data/user.db}"
  # 连接池与慢查询（SQLite 未显式配置时收敛为单连接防锁表）。
  slow_query_threshold: "${DB_SLOW_QUERY_THRESHOLD:-200ms}"
  max_open_conns: "${DB_MAX_OPEN_CONNS:-25}"
  max_idle_conns: "${DB_MAX_IDLE_CONNS:-10}"
  conn_max_lifetime: "${DB_CONN_MAX_LIFETIME:-1h}"
  conn_max_idle_time: "${DB_CONN_MAX_IDLE_TIME:-10m}"

# 认证配置：JWT 密钥与令牌有效期；secret 必须与 gateway 一致。
auth:
  jwt_secret: "${JWT_SECRET:-peak-dev-secret}"
  token_ttl: "${AUTH_TOKEN_TTL:-168h}"     # 默认 7 天
  master_code: ${AUTH_MASTER_CODE:-false}  # 超级验证码开关，仅开发模式生效

# 短信发送：provider 仅支持 mock（真实短信下一迭代接入）。
sms:
  provider: "mock"

# 邮件发送：provider 可选 mock（开发，验证码写日志）或 smtp（生产真实发信）。
mail:
  provider: ${MAIL_PROVIDER:-mock}
  smtp:
    host: "${SMTP_HOST:-}"        # 如 smtp.example.com:587
    username: "${SMTP_USERNAME:-}"
    password: "${SMTP_PASSWORD:-}"
    from: "${SMTP_FROM:-Peak <no-reply@peak.local>}"
