server:
  port: "${SERVER_PORT:-8081}"

log:
  development: ${LOG_DEV:-true}

tracing:
  endpoint: "${TRACING_ENDPOINT:-}"  # OpenTelemetry collector 地址，留空则不启用追踪

# 文件访问 URL 签名密钥：file-urls 签发与 files 流式端点校验共用；
# 取 JWT_SECRET（与网关一致），仅作 HMAC 签名用途，本服务不做 JWT 校验。
files:
  sign_secret: "${JWT_SECRET:-peak-dev-secret}"

storage:
  # question-service 使用专属桶/目录存放 committed/ 正式区；
  # recognition-service 的桶为源（见 storage.source），提交时跨桶对象拷贝。
  type: "${STORAGE_TYPE:-local}"
  root: "${STORAGE_ROOT:-./data}"  # 本地存储根目录（本服务专属）
  s3:
    endpoint: "${S3_ENDPOINT:-}"
    region: "${S3_REGION:-us-east-1}"
    access_key: "${S3_ACCESS_KEY:-}"
    secret_key: "${S3_SECRET_KEY:-}"  # 生产环境通过 .env/Secret 注入，勿提交仓库
    bucket: "${S3_BUCKET:-peak-question}"
    use_ssl: "${S3_USE_SSL:-false}"
    path_style: "${S3_PATH_STYLE:-false}"
  source:
    # 源存储 = recognition-service 的存储（transient/ 临时区）。
    # S3 后端提交拷贝走服务端 CopyObject，仅需要源桶名；
    # local 后端回退为跨目录复制，root 指向 recognition-service 的数据目录。
    root: "${STORAGE_SOURCE_ROOT:-./data}"
    s3:
      bucket: "${S3_SOURCE_BUCKET:-peak-recognition}"  # 与 recognition-service 的 S3_BUCKET 一致

database:
  dialect: "${DB_DIALECT:-mysql}"  # mysql / postgres / sqlite
  dsn: "${DB_DSN:-root:peak123456@tcp(127.0.0.1:3306)/peak?charset=utf8mb4&parseTime=True&loc=Local}"

# 错题导出依赖识别服务的图片接口读取题目配图（本地目录与对象存储均可）。
recognition:
  base_url: "${RECOGNITION_SERVICE_URL:-http://localhost:8082}"

export:
  max_items: "${EXPORT_MAX_ITEMS:-200}"               # 单次导出题数上限
  max_image_width: "${EXPORT_MAX_IMAGE_WIDTH:-1200}"  # 配图最大像素宽度，0 表示不限制
  fetch_timeout: "${EXPORT_FETCH_TIMEOUT:-10s}"       # 单张配图拉取超时
  font_path: "${EXPORT_FONT_PATH:-}"                  # 外部字体路径，留空使用内置中文字体
  merge_stem_line_breaks: "${EXPORT_MERGE_STEM_LINE_BREAKS:-false}"  # false 保留识别出的题干换行（渲染超宽仍自动折行）；true 则折叠为空格重排
